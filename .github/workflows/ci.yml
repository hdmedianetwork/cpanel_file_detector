name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          find . -name '*.php' -not -path './.git/*' -print0 | xargs -0 -n1 php -l
          php -l whm-plugin/index.cgi
      - name: Shell syntax
        run: |
          for f in install.sh bin/guard bin/*.sh scripts/*.sh tests/*.sh; do bash -n "$f"; done
      - name: VERSION is a version number
        run: grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+' VERSION

  test:
    name: End-to-end tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install jq
        run: sudo apt-get update -qq && sudo apt-get install -y -qq jq
      - name: Run tests/smoke.sh
        run: sudo env "PATH=$PATH" tests/smoke.sh
