name: Bug report
description: Something in Storage Guard is not working as it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. **Security problems should not be reported here.** See [SECURITY.md](https://github.com/hdmedianetwork/cpanel_file_detector/blob/main/SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Storage Guard version
      description: "`cat /opt/skyserver-storage-guard/VERSION`"
      placeholder: 0.1.2
    validations:
      required: true
  - type: input
    id: whm
    attributes:
      label: cPanel & WHM version and OS
      placeholder: WHM 134.0.23, AlmaLinux 9
  - type: textarea
    id: log
    attributes:
      label: Activity Log
      description: "The relevant lines from WHM → Storage Guard → Activity Log, or `tail -n 50 /var/log/skyserver-storage-guard.log`. Remove customer names if needed."
      render: text
